[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rp1-leakproof"
version = "1.0.0"
description = "Leak-proof, evidence-aware material screening for orthopedic implant research (decision support only)"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::FutureWarning",
  "ignore::UserWarning",
]
