benchmark:
  name: matbench_log_gvrh
  target_column: gvrh
  target_name: log_gvrh
  target_units: log(GPa)
  target_transform: log10
  n_folds: 5
  split_type: official_folds
  random_state: 42
  cache_file: data/raw/matbench_log_gvrh.pkl.gz
  provenance_file: data/raw/matbench_log_gvrh_provenance.json
  data_card: data_cards/matbench_log_gvrh_data_card.md

models:
  dummy: DummyRegressor(strategy=mean)
  ridge: Ridge(alpha=1.0)
  random_forest: RandomForestRegressor(n_estimators=300, max_features=0.33, min_samples_leaf=1, n_jobs=-1, random_state=42)
